[package]
name = "book-engine-desktop"
version = "0.1.0"
description = "Local Book Engine Desktop Reader"
authors = ["Maros Toth"]
edition = "2021"
# The oldest Rust that can build this. It is the highest `rust-version` of the crates in `Cargo.lock`, not tauri's
# own 1.77.2, because darling 0.24.1 and the icu crates ask for more. Cargo says so plainly on an older toolchain,
# instead of failing somewhere inside a dependency (TL-06).
rust-version = "1.88"

# Clippy's own default list is not the same on every release, and a rule that moves between them is a check that
# answers differently on two computers. `uninlined_format_args` is on by default in 1.88 and off in 1.98, which is
# how the first run of the workflow found 125 errors that `npm run check` never showed here. Naming it holds the
# answer still, whatever clippy the toolchain brings (TL-05).
[lints.clippy]
uninlined_format_args = "warn"

[lib]
name = "book_engine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# The folder picker the reader uses to point the app at their vault (LC-01).
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps the key order of a JSON file the app reads and writes back (_meta.json).
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The index skips a chapter whose text has not changed, by comparing a hash it saved. That hash must give the same
# answer on every computer and after every toolchain update, or every chapter is read again for nothing. It was
# `DefaultHasher`, which promises neither. `sha2` was already in Cargo.lock, because tauri's own build uses it
# (SI-06).
sha2 = "0.10"

# Only one copy of the app runs: a second start brings the open window to the front and ends (DS-13).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
